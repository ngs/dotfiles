model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"

[features]
apps = true
js_repl = false

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch"]
status_line_use_colors = true

[apps._default]
enabled = true
default_tools_approval_mode = "prompt"

[tool_suggest]
discoverables = [
  { type = "connector", id = "connector_947e0d954944416db111db556030eea6" },
]

[apps.connector_76869538009648d5b282a4bb21c3d157.tools."github.create_pull_request"]
approval_mode = "approve"

[notice]
hide_full_access_warning = true

[mcp_servers.circleback]
url = "https://circleback.ai/api/mcp"
